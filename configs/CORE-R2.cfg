enable
configure terminal
hostname CORE-R2
no ip domain-lookup
service password-encryption
enable secret ChangeMe!2026
username netadmin privilege 15 secret ChangeMe!2026
ip domain-name novacore.local

interface GigabitEthernet0/0
 description TRUNK-TO-F2-SW1
 no ip address
 no shutdown

interface GigabitEthernet0/0.30
 encapsulation dot1Q 30
 description FINANCE-GATEWAY
 ip address 10.10.30.1 255.255.255.240
 ip helper-address 10.10.60.10
 ip access-group FINANCE-IN in

interface GigabitEthernet0/0.40
 encapsulation dot1Q 40
 description PEOPLE-OPS-GATEWAY
 ip address 10.10.40.1 255.255.255.240
 ip helper-address 10.10.60.10
 ip access-group PEOPLE-IN in

interface GigabitEthernet0/0.50
 encapsulation dot1Q 50
 description GUEST-GATEWAY
 ip address 10.10.50.1 255.255.255.224
 ip helper-address 10.10.60.10
 ip access-group GUEST-IN in

interface Serial0/0/0
 description TO-CORE-R1
 ip address 10.255.0.6 255.255.255.252
 no shutdown

interface Serial0/0/1
 description TO-EDGE-R1
 ip address 10.255.0.10 255.255.255.252
 no shutdown

ip access-list extended FINANCE-IN
 remark Preserve DHCP before department restrictions
 permit udp any eq 68 any eq 67
 deny ip 10.10.30.0 0.0.0.15 10.10.40.0 0.0.0.15
 permit ip 10.10.30.0 0.0.0.15 any

ip access-list extended PEOPLE-IN
 remark Preserve DHCP before department restrictions
 permit udp any eq 68 any eq 67
 deny ip 10.10.40.0 0.0.0.15 10.10.30.0 0.0.0.15
 permit ip 10.10.40.0 0.0.0.15 any

ip access-list extended GUEST-IN
 remark Allow DHCP and internal DNS only
 permit udp any eq 68 any eq 67
 permit udp 10.10.50.0 0.0.0.31 host 10.10.60.10 eq 53
 permit tcp 10.10.50.0 0.0.0.31 host 10.10.60.10 eq 53
 deny ip 10.10.50.0 0.0.0.31 10.0.0.0 0.255.255.255
 deny ip 10.10.50.0 0.0.0.31 172.16.0.0 0.15.255.255
 deny ip 10.10.50.0 0.0.0.31 192.168.0.0 0.0.255.255
 permit ip 10.10.50.0 0.0.0.31 any

router ospf 10
 router-id 3.3.3.3
 passive-interface default
 no passive-interface Serial0/0/0
 no passive-interface Serial0/0/1
 network 10.10.0.0 0.0.255.255 area 0
 network 10.255.0.4 0.0.0.3 area 0
 network 10.255.0.8 0.0.0.3 area 0

ip access-list standard MGMT-SSH
 permit 10.10.10.0 0.0.0.31
 permit 10.10.99.0 0.0.0.15

crypto key generate rsa modulus 1024
ip ssh version 2
line console 0
 logging synchronous
 exec-timeout 10 0
line vty 0 4
 access-class MGMT-SSH in
 login local
 transport input ssh
 exec-timeout 10 0
end
copy running-config startup-config
