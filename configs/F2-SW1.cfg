enable
configure terminal
hostname F2-SW1
no ip domain-lookup

vlan 30
 name FINANCE
vlan 40
 name PEOPLE_OPS
vlan 50
 name GUEST

interface FastEthernet0/1
 description TRUNK-TO-CORE-R2
 switchport mode trunk
 switchport trunk allowed vlan 30,40,50

interface range FastEthernet0/2-4
 description FINANCE-CLIENTS
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast

interface range FastEthernet0/5-7
 description PEOPLE-OPS-CLIENTS
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast

interface range FastEthernet0/8-12
 description GUEST-CLIENTS
 switchport mode access
 switchport access vlan 50
 spanning-tree portfast

interface Vlan30
 description SWITCH-MANAGEMENT
 ip address 10.10.30.2 255.255.255.240
 no shutdown

ip default-gateway 10.10.30.1
end
copy running-config startup-config
