enable
configure terminal
hostname CORE-R1
no ip domain-lookup
service password-encryption
enable secret ChangeMe!2026
username netadmin privilege 15 secret ChangeMe!2026
ip domain-name novacore.local

interface GigabitEthernet0/0
 description TRUNK-TO-F1-SW1
 no ip address
 no shutdown

interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 description ENGINEERING-GATEWAY
 ip address 10.10.10.1 255.255.255.224
 ip helper-address 10.10.60.10

interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 description PRODUCT-GATEWAY
 ip address 10.10.20.1 255.255.255.240
 ip helper-address 10.10.60.10

interface GigabitEthernet0/1
 description TRUNK-TO-SRV-SW1
 no ip address
 no shutdown

interface GigabitEthernet0/1.60
 encapsulation dot1Q 60
 description SERVICES-GATEWAY
 ip address 10.10.60.1 255.255.255.240

interface GigabitEthernet0/1.99
 encapsulation dot1Q 99
 description MANAGEMENT-GATEWAY
 ip address 10.10.99.1 255.255.255.240

interface Serial0/0/0
 description TO-EDGE-R1
 ip address 10.255.0.2 255.255.255.252
 no shutdown

interface Serial0/0/1
 description TO-CORE-R2
 ip address 10.255.0.5 255.255.255.252
 clock rate 64000
 no shutdown

router ospf 10
 router-id 2.2.2.2
 passive-interface default
 no passive-interface Serial0/0/0
 no passive-interface Serial0/0/1
 network 10.10.0.0 0.0.255.255 area 0
 network 10.255.0.0 0.0.0.3 area 0
 network 10.255.0.4 0.0.0.3 area 0

ip access-list standard MGMT-SSH
 permit 10.10.10.0 0.0.0.31
 permit 10.10.99.0 0.0.0.15

crypto key generate rsa modulus 1024
ip ssh version 2
line console 0
 logging synchronous
 exec-timeout 10 0
line vty 0 4
 access-class MGMT-SSH in
 login local
 transport input ssh
 exec-timeout 10 0
end
copy running-config startup-config
