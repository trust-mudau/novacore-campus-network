enable
configure terminal
hostname EDGE-R1
no ip domain-lookup
service password-encryption
enable secret ChangeMe!2026
username netadmin privilege 15 secret ChangeMe!2026
ip domain-name novacore.local

interface GigabitEthernet0/0
 description TO-ISP-RTR
 ip address 203.0.113.2 255.255.255.240
 ip nat outside
 ip access-group INET-IN in
 no shutdown

interface GigabitEthernet0/1
 description TO-DMZ-SW1
 ip address 172.16.10.1 255.255.255.240
 ip nat inside
 ip access-group DMZ-OUT out
 no shutdown

interface Serial0/0/0
 description TO-CORE-R1
 ip address 10.255.0.1 255.255.255.252
 ip nat inside
 clock rate 64000
 no shutdown

interface Serial0/0/1
 description TO-CORE-R2
 ip address 10.255.0.9 255.255.255.252
 ip nat inside
 clock rate 64000
 no shutdown

ip access-list standard NAT_INSIDE
 permit 10.10.0.0 0.0.255.255

ip nat inside source list NAT_INSIDE interface GigabitEthernet0/0 overload
ip nat inside source static 172.16.10.10 203.0.113.10

ip access-list extended INET-IN
 remark Permit public web service only
 permit tcp any host 203.0.113.10 eq 80
 permit tcp any host 203.0.113.10 eq 443
 remark Permit return traffic for inside PAT sessions
 permit tcp any host 203.0.113.2 established
 permit udp any host 203.0.113.2 range 1024 65535
 permit icmp any host 203.0.113.2 echo-reply
 permit icmp any host 203.0.113.2 time-exceeded
 permit icmp any host 203.0.113.2 unreachable
 remark Block unsolicited access to private ranges
 deny ip any 10.0.0.0 0.255.255.255
 deny ip any 172.16.0.0 0.15.255.255
 deny ip any 192.168.0.0 0.0.255.255
 deny ip any any

ip access-list extended DMZ-OUT
 remark Public and internal web access
 permit tcp any host 172.16.10.10 eq 80
 permit tcp any host 172.16.10.10 eq 443
 remark SSH administration from Engineering only
 permit tcp 10.10.10.0 0.0.0.31 host 172.16.10.10 eq 22
 permit icmp 10.10.0.0 0.0.255.255 host 172.16.10.10 echo
 deny ip any 172.16.10.0 0.0.0.15

ip route 0.0.0.0 0.0.0.0 203.0.113.1

router ospf 10
 router-id 1.1.1.1
 passive-interface default
 no passive-interface Serial0/0/0
 no passive-interface Serial0/0/1
 network 10.255.0.0 0.0.0.3 area 0
 network 10.255.0.8 0.0.0.3 area 0
 network 172.16.10.0 0.0.0.15 area 0
 default-information originate

ip access-list standard MGMT-SSH
 permit 10.10.10.0 0.0.0.31
 permit 10.10.99.0 0.0.0.15

crypto key generate rsa modulus 1024
ip ssh version 2
line console 0
 logging synchronous
 exec-timeout 10 0
line vty 0 4
 access-class MGMT-SSH in
 login local
 transport input ssh
 exec-timeout 10 0
end
copy running-config startup-config
