<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">NovaCore Campus Network logical topology</title>
  <desc id="desc">An ISP connects to an edge router providing NAT and DMZ access. The edge and two core routers form an OSPF triangle. Core Router 1 serves Floor 1 and services; Core Router 2 serves Floor 2.</desc>
  <defs>
    <style>
      .bg{fill:#f5f7fb}.panel{fill:#fff;stroke:#d7deea;stroke-width:2}.router{fill:#174d73}.switch{fill:#216e73}.server{fill:#6e4f8b}.client{fill:#3367a5}.internet{fill:#5b6472}.title{font:700 34px Arial,sans-serif;fill:#172235}.subtitle{font:18px Arial,sans-serif;fill:#546176}.label{font:700 18px Arial,sans-serif;fill:#172235}.small{font:15px Arial,sans-serif;fill:#546176}.tiny{font:13px Arial,sans-serif;fill:#546176}.white{font:700 15px Arial,sans-serif;fill:#fff}.line{stroke:#5f6f82;stroke-width:4;fill:none}.wan{stroke:#c24d40;stroke-width:5;fill:none}.trunk{stroke:#24756f;stroke-width:5;stroke-dasharray:11 7;fill:none}.public{stroke:#7a56a2;stroke-width:5;fill:none}.zone-title{font:700 20px Arial,sans-serif;fill:#172235}.badge{fill:#edf3fa;stroke:#c6d4e5;stroke-width:1}.v10{fill:#e8f3ff;stroke:#7aaee6;stroke-width:2}.v20{fill:#edf8ee;stroke:#82bc86;stroke-width:2}.v30{fill:#fff1e5;stroke:#dc9b58;stroke-width:2}.v40{fill:#f6eefe;stroke:#a581c7;stroke-width:2}.v50{fill:#f1f2f4;stroke:#9aa2ae;stroke-width:2}.v60{fill:#e8f7f4;stroke:#5daf9f;stroke-width:2}.dmz{fill:#fff0f0;stroke:#d47c7c;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5f6f82"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1040"/>
  <text x="70" y="62" class="title">NovaCore Campus Network</text>
  <text x="70" y="92" class="subtitle">VLAN segmentation • OSPF resilience • centralized services • ACLs • PAT and static NAT • DMZ</text>

  <rect x="585" y="120" rx="18" ry="18" width="430" height="105" class="panel"/>
  <circle cx="670" cy="172" r="34" class="internet"/>
  <path d="M645 170c5-20 35-24 44-7 21-3 30 25 8 34h-48c-22-6-20-27-4-27z" fill="#fff" opacity=".95"/>
  <text x="725" y="160" class="label">ISP-RTR / simulated internet</text>
  <text x="725" y="186" class="small">WAN 203.0.113.1/28 • PUBLIC-PC 198.51.100.10</text>

  <path d="M800 225 L800 285" class="public"/>
  <text x="820" y="260" class="small">203.0.113.0/28</text>

  <rect x="670" y="285" rx="16" ry="16" width="260" height="92" class="router"/>
  <text x="800" y="320" text-anchor="middle" class="white">EDGE-R1</text>
  <text x="800" y="346" text-anchor="middle" class="white">PAT • static NAT • edge ACL</text>
  <text x="800" y="368" text-anchor="middle" class="white">Public web: 203.0.113.10</text>

  <path d="M715 377 L520 500" class="wan"/>
  <path d="M885 377 L1080 500" class="wan"/>
  <path d="M570 540 L1030 540" class="wan"/>
  <text x="555" y="420" class="tiny">10.255.0.0/30</text>
  <text x="910" y="420" class="tiny">10.255.0.8/30</text>
  <text x="745" y="526" class="tiny">10.255.0.4/30</text>
  <rect x="700" y="455" rx="16" ry="16" width="200" height="42" class="badge"/>
  <text x="800" y="482" text-anchor="middle" class="label">OSPF area 0</text>

  <rect x="390" y="500" rx="16" ry="16" width="180" height="80" class="router"/>
  <text x="480" y="533" text-anchor="middle" class="white">CORE-R1</text>
  <text x="480" y="558" text-anchor="middle" class="white">Floors 1 + services</text>
  <rect x="1030" y="500" rx="16" ry="16" width="180" height="80" class="router"/>
  <text x="1120" y="533" text-anchor="middle" class="white">CORE-R2</text>
  <text x="1120" y="558" text-anchor="middle" class="white">Floor 2 gateway</text>

  <path d="M930 330 L1250 330" class="line"/>
  <rect x="1250" y="255" rx="18" ry="18" width="285" height="150" class="dmz"/>
  <text x="1275" y="286" class="zone-title">DMZ • VLAN 70</text>
  <rect x="1280" y="310" rx="10" ry="10" width="92" height="58" class="switch"/>
  <text x="1326" y="345" text-anchor="middle" class="white">DMZ-SW1</text>
  <path d="M1372 339 L1410 339" class="line"/>
  <rect x="1410" y="305" rx="10" ry="10" width="100" height="68" class="server"/>
  <text x="1460" y="335" text-anchor="middle" class="white">DMZ-WEB</text>
  <text x="1460" y="357" text-anchor="middle" class="white">172.16.10.10</text>
  <text x="1275" y="392" class="tiny">HTTP/HTTPS: any • SSH: Engineering only</text>

  <path d="M480 580 L480 655" class="trunk"/>
  <path d="M510 580 L760 655" class="trunk"/>
  <path d="M1120 580 L1120 655" class="trunk"/>

  <rect x="65" y="655" rx="20" ry="20" width="560" height="320" class="panel"/>
  <text x="95" y="692" class="zone-title">Floor 1 • F1-SW1</text>
  <rect x="285" y="710" rx="10" ry="10" width="120" height="58" class="switch"/>
  <text x="345" y="745" text-anchor="middle" class="white">F1-SW1</text>
  <path d="M345 768 L230 820" class="line"/>
  <path d="M345 768 L460 820" class="line"/>
  <rect x="95" y="820" rx="15" ry="15" width="235" height="120" class="v10"/>
  <text x="118" y="854" class="label">VLAN 10 • Engineering</text>
  <text x="118" y="882" class="small">10.10.10.0/27</text>
  <rect x="118" y="900" rx="8" ry="8" width="58" height="28" class="client"/>
  <rect x="188" y="900" rx="8" ry="8" width="58" height="28" class="client"/>
  <rect x="258" y="900" rx="8" ry="8" width="48" height="28" class="client"/>
  <rect x="360" y="820" rx="15" ry="15" width="235" height="120" class="v20"/>
  <text x="383" y="854" class="label">VLAN 20 • Product</text>
  <text x="383" y="882" class="small">10.10.20.0/28</text>
  <rect x="383" y="900" rx="8" ry="8" width="58" height="28" class="client"/>
  <rect x="453" y="900" rx="8" ry="8" width="58" height="28" class="client"/>

  <rect x="650" y="655" rx="20" ry="20" width="300" height="320" class="panel"/>
  <text x="680" y="692" class="zone-title">Services • SRV-SW1</text>
  <rect x="740" y="710" rx="10" ry="10" width="120" height="58" class="switch"/>
  <text x="800" y="745" text-anchor="middle" class="white">SRV-SW1</text>
  <path d="M800 768 L800 820" class="line"/>
  <rect x="680" y="820" rx="15" ry="15" width="240" height="120" class="v60"/>
  <text x="703" y="854" class="label">VLAN 60 • Services</text>
  <text x="703" y="882" class="small">DNS • DHCP • intranet</text>
  <rect x="720" y="900" rx="8" ry="8" width="160" height="28" class="server"/>
  <text x="800" y="920" text-anchor="middle" class="white">10.10.60.10</text>
  <text x="680" y="962" class="tiny">VLAN 99: 10.10.99.0/28 management</text>

  <rect x="975" y="655" rx="20" ry="20" width="560" height="320" class="panel"/>
  <text x="1005" y="692" class="zone-title">Floor 2 • F2-SW1</text>
  <rect x="1195" y="710" rx="10" ry="10" width="120" height="58" class="switch"/>
  <text x="1255" y="745" text-anchor="middle" class="white">F2-SW1</text>
  <path d="M1255 768 L1090 820" class="line"/>
  <path d="M1255 768 L1255 820" class="line"/>
  <path d="M1255 768 L1420 820" class="line"/>
  <rect x="1005" y="820" rx="15" ry="15" width="155" height="120" class="v30"/>
  <text x="1020" y="854" class="label">VLAN 30</text><text x="1020" y="880" class="small">Finance</text><text x="1020" y="906" class="tiny">10.10.30.0/28</text>
  <rect x="1178" y="820" rx="15" ry="15" width="155" height="120" class="v40"/>
  <text x="1193" y="854" class="label">VLAN 40</text><text x="1193" y="880" class="small">People Ops</text><text x="1193" y="906" class="tiny">10.10.40.0/28</text>
  <rect x="1350" y="820" rx="15" ry="15" width="155" height="120" class="v50"/>
  <text x="1365" y="854" class="label">VLAN 50</text><text x="1365" y="880" class="small">Guest</text><text x="1365" y="906" class="tiny">10.10.50.0/27</text>
  <text x="1005" y="962" class="tiny">Finance ↔ People Ops blocked • Guest isolated from private networks</text>

  <text x="70" y="1015" class="tiny">Dashed teal = 802.1Q trunk • red = routed OSPF link • purple = public link • grey = access link</text>
</svg>
